<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="980" height="600" viewBox="0 0 980 600" font-family="'Segoe UI', -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e8f3ff"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a7bc4"/>
      <stop offset="1" stop-color="#0b4f8a"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b4f8a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <style>
    @keyframes flow { to { stroke-dashoffset: -16; } }
    @keyframes pulse { 0%,100% { opacity: .16; transform: scale(1); } 50% { opacity: .42; transform: scale(1.14); } }
    @keyframes ring { 0% { transform: scale(.6); opacity: .55; } 100% { transform: scale(2.1); opacity: 0; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .pulse  { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; }
    .pulse2 { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; animation-delay: 1.3s; }
    .ring   { transform-box: fill-box; transform-origin: center; animation: ring 2.6s ease-out infinite; }
    .flow-line  { stroke-dasharray: 9 7; animation: flow 1.1s linear infinite; }
    .flow-line2 { stroke-dasharray: 9 7; animation: flow 1.6s linear infinite; }
    .flow-dash  { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    .blink { animation: blink 2s ease-in-out infinite; }
    .float { animation: floaty 4s ease-in-out infinite; }
    .float2 { animation: floaty 4s ease-in-out infinite; animation-delay: 2s; }
    .step-anim { animation: pulse 1.8s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect x="10" y="10" width="960" height="580" rx="26" fill="url(#bgGrad)" stroke="#cfe4f7" stroke-width="1.5"/>

  <!-- Title -->
  <text x="490" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="#0b4f8a">TaskLoop &#8212; System Architecture</text>
  <text x="490" y="76" text-anchor="middle" font-size="13.5" fill="#64748b">Progressive Web App &#160;&#183;&#160; Node.js + Express &#160;&#183;&#160; MongoDB</text>

  <!-- ================= CLIENT CARD ================= -->
  <g class="float">
    <rect x="30" y="120" width="260" height="260" rx="20" fill="#ffffff" stroke="#d3e7f8" filter="url(#shadow)"/>
    <rect x="46" y="136" width="228" height="26" rx="13" fill="#e7f2fd" stroke="#b9d9f5"/>
    <text x="160" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="#0a7bc4" letter-spacing="1">CLIENTS</text>
    <text x="160" y="180" text-anchor="middle" font-size="17" font-weight="800" fill="#0b4f8a">PWA &#183; Browser</text>

    <circle cx="86" cy="226" r="52" fill="#0a7bc4" class="pulse"/>
    <circle cx="86" cy="226" r="52" fill="none" stroke="#0a7bc4" stroke-width="2" class="ring"/>
    <rect x="66" y="184" width="40" height="84" rx="9" fill="url(#clientGrad)"/>
    <rect x="71" y="192" width="30" height="62" rx="4" fill="#ffffff" opacity=".18"/>
    <circle cx="86" cy="260" r="3" fill="#ffffff" opacity=".6"/>
    <text x="124" y="203" font-size="15" font-weight="700" fill="#0b4f8a">Mobile phone</text>
    <text x="124" y="220" font-size="11.5" fill="#64748b">Installable PWA</text>

    <circle cx="86" cy="322" r="48" fill="#0a7bc4" class="pulse2"/>
    <rect x="66" y="322" width="112" height="9" rx="4.5" fill="url(#clientGrad)"/>
    <rect x="70" y="311" width="104" height="16" rx="4" fill="url(#clientGrad)"/>
    <rect x="74" y="314" width="42" height="5" rx="2.5" fill="#ffffff" opacity=".28"/>
    <text x="124" y="325" font-size="15" font-weight="700" fill="#0b4f8a">Desktop</text>
    <text x="124" y="342" font-size="11.5" fill="#64748b">Chrome / Edge</text>
    <text x="160" y="368" text-anchor="middle" font-size="10.5" fill="#94a3b8">localStorage: token &#183; settings &#183; offline cache</text>
  </g>

  <!-- ================= SERVER CARD ================= -->
  <g class="float2">
    <rect x="360" y="120" width="260" height="260" rx="20" fill="url(#serverGrad)" stroke="#cfe4f7" filter="url(#shadow)"/>
    <circle cx="432" cy="200" r="56" fill="#0a7bc4" class="pulse"/>
    <circle cx="432" cy="200" r="56" fill="none" stroke="#0a7bc4" stroke-width="2" class="ring"/>
    <rect x="398" y="176" width="68" height="10" rx="3" fill="#0a7bc4"/>
    <rect x="398" y="190" width="68" height="10" rx="3" fill="#0a7bc4" opacity=".72"/>
    <rect x="398" y="204" width="68" height="10" rx="3" fill="#0a7bc4" opacity=".45"/>
    <rect x="398" y="218" width="44" height="8" rx="4" fill="#10b981" class="blink"/>
    <text x="486" y="192" font-size="17" font-weight="800" fill="#0b4f8a">Node.js + Express</text>
    <text x="486" y="210" font-size="11.5" fill="#64748b">API server &#183; mongoose &#183; bcrypt</text>

    <rect x="400" y="244" width="100" height="26" rx="13" fill="#ffffff" stroke="#cfe4f7"/>
    <text x="450" y="261" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0a7bc4">REST &#183; :4000</text>
    <rect x="506" y="244" width="94" height="26" rx="13" fill="#ffffff" stroke="#cfe4f7"/>
    <text x="553" y="261" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0a7bc4">Web &#183; :8000</text>
    <rect x="400" y="276" width="100" height="26" rx="13" fill="#ffffff" stroke="#cfe4f7"/>
    <text x="450" y="293" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0a7bc4">JWT sessions</text>
    <rect x="506" y="276" width="94" height="26" rx="13" fill="#ffffff" stroke="#cfe4f7"/>
    <text x="553" y="293" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0a7bc4">24h reset</text>
    <rect x="400" y="308" width="200" height="26" rx="13" fill="#ffffff" stroke="#cfe4f7"/>
    <text x="500" y="325" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0a7bc4">Reminders &#183; sound presets</text>
    <text x="490" y="362" text-anchor="middle" font-size="10.5" fill="#94a3b8">auto-starts MongoDB if stopped &#183; CORS enabled</text>
  </g>

  <!-- ================= DATABASE CARD ================= -->
  <g class="float">
    <rect x="690" y="120" width="260" height="260" rx="20" fill="#ffffff" stroke="#d3e7f8" filter="url(#shadow)"/>
    <circle cx="790" cy="196" r="54" fill="#10b981" class="pulse2"/>
    <circle cx="790" cy="196" r="54" fill="none" stroke="#10b981" stroke-width="2" class="ring"/>
    <ellipse cx="790" cy="176" rx="36" ry="11" fill="#047857"/>
    <path d="M754,176 L754,228 A36,11 0 0 0 826,228 L826,176 Z" fill="#10b981"/>
    <ellipse cx="790" cy="202" rx="36" ry="11" fill="#34d399" opacity=".8"/>
    <ellipse cx="779" cy="176" rx="15" ry="5" fill="#ffffff" opacity=".35"/>
    <text x="790" y="262" text-anchor="middle" font-size="17" font-weight="800" fill="#047857">MongoDB</text>
    <text x="790" y="280" text-anchor="middle" font-size="11.5" fill="#64748b">users &#183; tasks collections</text>
    <rect x="706" y="300" width="168" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="790" y="317" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">local &#183; 127.0.0.1:27017</text>
    <text x="790" y="358" text-anchor="middle" font-size="10.5" fill="#94a3b8">Windows service &#183; auto-start</text>
  </g>

  <!-- ================= CONNECTOR: CLIENT -> SERVER ================= -->
  <path d="M290,240 L360,240" stroke="#0a7bc4" stroke-width="3" fill="none" class="flow-line"/>
  <path d="M360,240 L352,234 M360,240 L352,246" stroke="#0a7bc4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle r="5" fill="#0a7bc4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M290,240 L360,240"/></circle>
  <circle r="5" fill="#0a7bc4"><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.1s" path="M290,240 L360,240"/></circle>
  <rect x="297" y="220" width="56" height="18" rx="9" fill="#0b4f8a"/>
  <text x="325" y="232.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">REST &#183; JSON</text>

  <!-- step badges -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.15;.22;.5;.55" dur="5s" repeatCount="indefinite"/>
    <circle cx="318" cy="196" r="11" fill="#f59e0b"/>
    <text x="318" y="200" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">1</text>
    <text x="340" y="199" font-size="10.5" fill="#64748b">Login / Signup</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.5;0.55;0.62;0.85;0.9" dur="5s" repeatCount="indefinite"/>
    <circle cx="318" cy="196" r="11" fill="#0a7bc4"/>
    <text x="318" y="200" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">2</text>
    <text x="340" y="199" font-size="10.5" fill="#64748b">Sync tasks</text>
  </g>

  <!-- ================= CONNECTOR: SERVER -> DB ================= -->
  <path d="M620,240 L690,240" stroke="#10b981" stroke-width="3" fill="none" class="flow-line2"/>
  <path d="M690,240 L682,234 M690,240 L682,246" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle r="5" fill="#10b981"><animateMotion dur="2.6s" repeatCount="indefinite" path="M620,240 L690,240"/></circle>
  <circle r="5" fill="#10b981"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.3s" path="M620,240 L690,240"/></circle>
  <rect x="633" y="220" width="44" height="18" rx="9" fill="#047857"/>
  <text x="655" y="232.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">mongoose</text>

  <!-- ================= GITHUB PAGES CARD ================= -->
  <g>
    <rect x="30" y="430" width="590" height="130" rx="20" fill="#ffffff" stroke="#d3e7f8" filter="url(#shadow)"/>
    <circle cx="82" cy="495" r="24" fill="#0b4f8a"/>
    <circle cx="82" cy="495" r="24" fill="none" stroke="#ffffff" stroke-width="3" opacity=".35"/>
    <path d="M74,500 L74,488 a8,8 0 0 1 16,0 L90,500" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M74,488 h16 M74,491 h16" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="74" cy="488" r="1.6" fill="#ffffff"/>
    <circle cx="90" cy="488" r="1.6" fill="#ffffff"/>
    <text x="124" y="486" font-size="16.5" font-weight="800" fill="#0b4f8a">GitHub Pages &#8212; public HTTPS host</text>
    <text x="124" y="506" font-size="12" font-weight="600" fill="#0a7bc4">https://nagurbabu135-glitch.github.io/taskapp/</text>
    <text x="124" y="526" font-size="11.5" fill="#64748b">Serves the app shell anywhere &#183; API stays on your local server</text>
    <text x="124" y="546" font-size="10.5" fill="#94a3b8">Tip: on your phone, open the app from the connect page (http://&lt;PC-IP&gt;:8000) so the API works</text>
  </g>

  <!-- dashed connector: GitHub -> Client -->
  <path d="M325,430 C320,404 250,404 172,384" stroke="#94a3b8" stroke-width="2.5" fill="none" class="flow-dash"/>
  <path d="M172,384 L181,380 M172,384 L175,393" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle r="4" fill="#94a3b8"><animateMotion dur="3s" repeatCount="indefinite" path="M325,430 C320,404 250,404 172,384"/></circle>
  <rect x="196" y="404" width="112" height="18" rx="9" fill="#64748b"/>
  <text x="252" y="416.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">app shell (HTTPS)</text>

  <!-- ================= KEY BEHAVIORS / LEGEND ================= -->
  <rect x="660" y="430" width="290" height="130" rx="20" fill="#ffffff" stroke="#d3e7f8" filter="url(#shadow)"/>
  <text x="805" y="456" text-anchor="middle" font-size="14" font-weight="800" fill="#0b4f8a">Key behaviors</text>
  <circle cx="684" cy="478" r="4.5" fill="#0a7bc4" class="step-anim"/><text x="698" y="482" font-size="12" fill="#334155">Persistent sessions &#8212; JWT valid 365 days</text>
  <circle cx="684" cy="502" r="4.5" fill="#f59e0b" class="step-anim"/><text x="698" y="506" font-size="12" fill="#334155">24-hour task auto-reset</text>
  <circle cx="684" cy="526" r="4.5" fill="#10b981" class="step-anim"/><text x="698" y="530" font-size="12" fill="#334155">Daily reminders &#183; custom sounds</text>
  <circle cx="684" cy="550" r="4.5" fill="#64748b" class="step-anim"/><text x="698" y="554" font-size="12" fill="#334155">Offline cache (service worker)</text>
</svg>
